<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Signal Desk home interface preview</title>
  <desc id="desc">Desktop preview of the personalized news dashboard using fictional sample data.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#14231c" flood-opacity=".06"/></filter>
    <style>
      .sans{font-family:Inter,Arial,sans-serif}.serif{font-family:Georgia,serif}.muted{fill:#69736e}.ink{fill:#17201d}.green{fill:#184f3b}.eyebrow{font:700 11px Inter,Arial,sans-serif;letter-spacing:1.5px}.small{font:500 12px Inter,Arial,sans-serif}.body{font:400 14px Inter,Arial,sans-serif}.strong{font:700 14px Inter,Arial,sans-serif}.nav{font:600 14px Inter,Arial,sans-serif}.rule{stroke:#dde2dd}.card{fill:#fff;stroke:#dde2dd}
    </style>
  </defs>
  <rect width="1440" height="900" fill="#f7f8f5"/>
  <rect width="1440" height="30" fill="#fff9e8"/><text x="720" y="19" text-anchor="middle" class="small" fill="#725415">DEMO WORKSPACE  ·  All stories, publications, people, documents and citations are fictional sample data.</text>
  <rect y="30" width="1440" height="64" fill="#f7f8f5" stroke="#dde2dd"/>
  <rect x="40" y="46" width="32" height="32" rx="8" fill="#184f3b"/><text x="56" y="68" fill="white" text-anchor="middle" font-family="Georgia" font-weight="700">S</text>
  <text x="82" y="69" class="serif ink" font-size="21" font-weight="700">Signal Desk</text>
  <rect x="238" y="44" width="88" height="36" rx="9" fill="#dbe7df"/><text x="282" y="67" text-anchor="middle" class="nav green">⌂  Home</text>
  <text x="354" y="67" class="nav muted">Explore</text><text x="438" y="67" class="nav muted">My feeds</text>
  <circle cx="1320" cy="62" r="18" fill="#fff" stroke="#dde2dd"/><text x="1320" y="67" text-anchor="middle" class="body muted">⌕</text><text x="1364" y="67" text-anchor="middle" class="nav muted">AM</text>

  <g transform="translate(40 135)">
    <text class="eyebrow muted">THURSDAY, 1 OCTOBER</text>
    <text y="54" class="serif ink" font-size="48" font-weight="700">Good morning, Alex.</text>
    <text y="87" class="body muted" font-size="16">Your briefing brings together the events that matter to your saved interests.</text>
    <rect x="1130" y="25" width="230" height="44" rx="9" fill="#fff" stroke="#dde2dd"/><text x="1151" y="52" class="strong muted">◉  Audio briefing</text><rect x="1266" y="38" width="76" height="19" rx="4" fill="#f7f8f5"/><text x="1304" y="51" text-anchor="middle" class="eyebrow muted" font-size="9">PLANNED</text>
  </g>
  <g transform="translate(40 250)">
    <rect width="96" height="38" rx="9" fill="#184f3b"/><text x="48" y="24" text-anchor="middle" fill="white" class="strong">☷  Filters</text>
    <rect x="106" width="118" height="38" rx="9" fill="#fff" stroke="#dde2dd"/><text x="165" y="24" text-anchor="middle" class="strong ink">All topics ⌄</text>
    <rect x="234" width="140" height="38" rx="9" fill="#fff" stroke="#dde2dd"/><text x="304" y="24" text-anchor="middle" class="strong ink">All locations ⌄</text>
    <rect x="384" width="132" height="38" rx="9" fill="#fff" stroke="#dde2dd"/><text x="450" y="24" text-anchor="middle" class="strong ink">Last 7 days ⌄</text>
  </g>

  <g transform="translate(40 330)">
    <text class="eyebrow muted">YOUR BRIEFING</text><text y="31" class="serif ink" font-size="27" font-weight="700">Top stories</text><text x="980" y="25" text-anchor="end" class="strong green">View all →</text>
    <g transform="translate(0 52)" filter="url(#shadow)"><rect width="475" height="445" rx="16" class="card"/><path d="M0 16Q0 0 16 0H459Q475 0 475 16V212H0Z" fill="#dfe8dc"/><circle cx="388" cy="160" r="88" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="28"/><rect x="30" y="32" width="75" height="4" fill="#184f3b" opacity=".45"/><rect x="30" y="52" width="142" height="4" fill="#184f3b" opacity=".2"/><rect x="16" y="177" width="98" height="23" rx="5" fill="#fff" opacity=".92"/><text x="65" y="192" text-anchor="middle" class="eyebrow muted" font-size="9">SAMPLE STORY</text>
      <text x="24" y="244" class="eyebrow muted">ECONOMY · INDIA</text><text x="24" y="282" class="serif ink" font-size="27" font-weight="700">RBI holds policy rate as</text><text x="24" y="316" class="serif ink" font-size="27" font-weight="700">banks weigh the outlook</text><text x="24" y="348" class="body muted">India’s central bank retained its benchmark policy</text><text x="24" y="371" class="body muted">rate at its scheduled review. The published resolution…</text><text x="24" y="414" class="small muted">▱  3 independent sources       1d ago</text>
    </g>
    <g transform="translate(495 52)" filter="url(#shadow)"><rect width="485" height="212" rx="16" class="card"/><rect width="170" height="212" rx="16" fill="#e9e3d6"/><path d="M170 0V212" class="rule"/><circle cx="135" cy="155" r="66" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="20"/><text x="190" y="30" class="eyebrow muted">ENVIRONMENT · DELHI NCR</text><text x="190" y="64" class="serif ink" font-size="20" font-weight="700">Delhi agencies publish</text><text x="190" y="90" class="serif ink" font-size="20" font-weight="700">seasonal air-quality calendar</text><text x="190" y="122" class="body muted">Local agencies have released a schedule</text><text x="190" y="143" class="body muted">of monitoring and mitigation steps…</text><text x="190" y="185" class="small muted">▱  2 independent sources · 2d ago</text></g>
    <g transform="translate(495 285)" filter="url(#shadow)"><rect width="485" height="212" rx="16" class="card"/><rect width="170" height="212" rx="16" fill="#dde5eb"/><path d="M170 0V212" class="rule"/><circle cx="135" cy="155" r="66" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="20"/><text x="190" y="30" class="eyebrow muted">TECHNOLOGY · JAPAN</text><text x="190" y="64" class="serif ink" font-size="20" font-weight="700">Japan proposes semiconductor</text><text x="190" y="90" class="serif ink" font-size="20" font-weight="700">research partnership</text><text x="190" y="122" class="body muted">A proposed research program would</text><text x="190" y="143" class="body muted">connect universities and manufacturers…</text><text x="190" y="185" class="small muted">▱  2 independent sources · 3d ago</text></g>

    <g transform="translate(1020 0)" filter="url(#shadow)"><rect width="340" height="250" rx="16" class="card"/><text x="20" y="34" class="serif ink" font-size="21" font-weight="700">Saved feeds</text><rect x="292" y="14" width="30" height="30" rx="8" fill="#dbe7df"/><text x="307" y="35" text-anchor="middle" class="green" font-size="20">+</text><path d="M20 63H320M20 123H320M20 183H320" class="rule"/><text x="20" y="86" class="strong ink">My Market Brief</text><text x="20" y="106" class="small muted">◷  24h · 2 stories</text><text x="20" y="146" class="strong ink">Delhi Watch</text><text x="20" y="166" class="small muted">◷  48h · 2 stories</text><text x="20" y="206" class="strong ink">Japan Deep Tech</text><text x="20" y="226" class="small muted">◷  3d · 1 story</text></g>
    <g transform="translate(1020 270)" filter="url(#shadow)"><rect width="340" height="227" rx="16" class="card"/><text x="20" y="30" class="eyebrow muted">TRENDING IN YOUR INTERESTS</text><text x="20" y="73" class="serif" font-size="20" fill="#cbd1cc">01</text><text x="61" y="72" class="strong ink">RBI policy</text><text x="20" y="113" class="serif" font-size="20" fill="#cbd1cc">02</text><text x="61" y="112" class="strong ink">Delhi air quality</text><text x="20" y="153" class="serif" font-size="20" fill="#cbd1cc">03</text><text x="61" y="152" class="strong ink">Semiconductor research</text><text x="20" y="193" class="serif" font-size="20" fill="#cbd1cc">04</text><text x="61" y="192" class="strong ink">Metro expansion</text></g>
  </g>
</svg>
